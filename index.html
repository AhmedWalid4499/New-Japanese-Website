  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash
    try {
      var s = JSON.parse(localStorage.getItem('sakura_settings') || '{}');
      var t = s.theme || (localStorage.getItem('sakura_dark') === '1' ? 'dark' : 'auto');
      if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
